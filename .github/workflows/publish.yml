name: Publish verified image

# A deployment-WAN canary authorizes exactly one source commit and one exact
# PEP 440 yt-dlp distribution version by pushing an SSH-signed tag. There is
# intentionally no workflow_dispatch or workflow_call bypass.
on:
  push:
    tags:
      - "deploy-ytdlp-v*--*"

concurrency:
  group: publish-image
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  metadata:
    name: Verify release authorization
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.verify.outputs.version }}
      short_sha: ${{ steps.verify.outputs.short_sha }}
      commit: ${{ steps.verify.outputs.commit }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable tag metadata
        id: verify
        env:
          DEPLOY_TAG: ${{ github.ref_name }}
        run: |
          test "$GITHUB_REF_TYPE" = "tag"
          test "$(git cat-file -t "refs/tags/$DEPLOY_TAG")" = "tag"
          test "$(git for-each-ref --format='%(tag)' "refs/tags/$DEPLOY_TAG")" = "$DEPLOY_TAG"
          git -c gpg.format=ssh \
            -c gpg.ssh.allowedSignersFile="$GITHUB_WORKSPACE/config/release_allowed_signers" \
            verify-tag "$DEPLOY_TAG"

          checkout_sha="$(git rev-parse "$DEPLOY_TAG^{commit}")"
          test "$(git rev-parse HEAD)" = "$checkout_sha"
          version="$(python tools/ytdlp_release.py verify-tag "$DEPLOY_TAG" "$checkout_sha")"

          # A replayed or stale authorization must not move publication tags.
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          test "$checkout_sha" = "$(git rev-parse refs/remotes/origin/main)"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "short_sha=${checkout_sha:0:7}" >> "$GITHUB_OUTPUT"
          echo "commit=$checkout_sha" >> "$GITHUB_OUTPUT"
          echo "Authorized yt-dlp $version at $checkout_sha"

  test:
    name: Re-test authorized source
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install exact authorized dependencies
        env:
          YTDLP_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install --force-reinstall "yt-dlp[default]==${YTDLP_VERSION}"
          pip install pytest pytest-asyncio ruff
          installed="$(python -c 'from importlib.metadata import version; print(version("yt-dlp"))')"
          test "$installed" = "$YTDLP_VERSION"

      - name: Validate source and deployment files
        run: |
          ruff check --no-cache .
          python -m compileall -q music_bot.py setup.py src tools tests
          pytest -m "not network" -v
          bash -n bin/*.sh
          python -c 'import glob, plistlib; [plistlib.load(open(path, "rb")) for path in glob.glob("config/*.plist")]'
          cp .env.example .env
          docker compose config --quiet

  publish:
    name: Build and push
    needs: [metadata, test]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        env:
          YTDLP_VERSION: ${{ needs.metadata.outputs.version }}
          SHORT_SHA: ${{ needs.metadata.outputs.short_sha }}
          FULL_SHA: ${{ needs.metadata.outputs.commit }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tags="${image}:latest"
          tags="${tags},${image}:sha-${SHORT_SHA}"
          tags="${tags},${image}:ytdlp-${YTDLP_VERSION}"
          tags="${tags},${image}:ytdlp-${YTDLP_VERSION}-sha-${FULL_SHA}"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "Publishing: $tags"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            YT_DLP_VERSION=${{ needs.metadata.outputs.version }}
          labels: |
            org.opencontainers.image.revision=${{ needs.metadata.outputs.commit }}
            org.opencontainers.image.version=${{ needs.metadata.outputs.version }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
