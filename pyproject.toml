[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "network: hits a live third-party service (YouTube, Spotify). Excluded from CI, since a failure would mean 'YouTube is having a moment', not 'this commit is broken'.",
    "discord_token: needs a real DISCORD_TOKEN to run.",
]
filterwarnings = [
    "ignore::DeprecationWarning:discord.*",
]

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = ["music_library", "cache", "__pycache__"]

[tool.ruff.lint]
# Deliberately narrow: this is a linting pass added to an existing codebase, so
# it flags things that break at runtime (undefined names, bad f-strings) rather
# than restyling code that already works.
select = ["E9", "F63", "F7", "F82", "F821", "F841"]
