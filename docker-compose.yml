# Deployment compose file.
#
# Runs the image CI publishes rather than building locally. CI verifies yt-dlp
# against real YouTube before publishing, so what lands here has already been
# checked, and a rollback is a tag change instead of a rebuild.
#
# Updates are pulled by bin/update.sh on a timer — see docs/DEPLOYMENT.md.
# Nothing here has access to the Docker socket, and no third-party agent runs
# alongside the bot.
#
# For local development against your working tree:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
services:
  music-bot:
    # Defaults to the upstream image so a fresh clone runs without any registry
    # setup. If you forked this and changed the code, that default is not your
    # code — set BOT_IMAGE to your own package, or build locally with
    # docker-compose.dev.yml. See "Running your own fork" in docs/DEPLOYMENT.md.
    image: ${BOT_IMAGE:-ghcr.io/sgt-cho/discord_music_bot:latest}
    container_name: discord-music-bot
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./music_library:/app/cache/audio
    networks:
      - bot-network
    # Healthcheck to guard against TCP connection exhaustion
    healthcheck:
      test: ["CMD", "python", "-c", "import psutil; exit(0 if len(psutil.net_connections('tcp')) < 10000 else 1)"]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  bot-network:
    driver: bridge
